[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booth-pipeline"
version = "0.1.0"
description = "Project Booth's pipeline module: a graphical DAG builder for Tasks (standalone, independently versioned units of code) referenced by Pipelines, backed by Dagster, with a base runner that needs no other module."
requires-python = ">=3.11,<3.15"
dependencies = [
  "dagster>=1.12,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "croniter>=3.0",
  "pydantic>=2.8",
  "tzdata",            # zoneinfo has no IANA database on Windows or slim images without it
  "duckdb>=1.0",       # the base runner's SQL language strategy (ADR 0064); embedded, no server to reach
  "pyyaml>=6",         # a pipeline version's YAML export (ADR 0071 phase 4)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
booth-pipeline = "booth_pipeline.__main__:main"
booth-pipeline-runner = "booth_pipeline.runner_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booth_pipeline = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"src/booth_pipeline/runners/_harness.py" = ["UP031"]  # stdlib-only script run under python -I
