# Default values for booth-pipeline.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-pipeline
  tag: "" # defaults to Chart.appVersion; overridden by CI to the published tag (contracts/testing-strategy.md)
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # Required: the same OIDC issuer/client every module verifies against independently
  # (core-platform-api.md's defense-in-depth requirement). Left empty by default.
  issuerUrl: ""
  # ADR 0108: optional. Fetch the IdP's signing keys from this URL directly instead of via the
  # issuer's discovery document; `iss` is still checked against issuerUrl exactly. The bundled
  # install sets it to the IdP's in-cluster Service over plain http, so no pod needs to trust the
  # Ingress certificate. That fetch is unauthenticated: it relies on NetworkPolicy and cluster trust.
  # Leave empty for an external provider (ordinary discovery).
  jwksUrl: ""
  clientId: ""
  requireAudience: true
  # The token claim carrying workspace memberships (ADR 0025). Must match booth-core's
  # BOOTH_OIDC_GROUPS_CLAIM, or every request is refused.
  groupsClaim: groups

# Pipelines, versions, jobs, runs and logs live in this module's own database on the shared
# PostgreSQL cluster (ADR 0014). booth-core provisions the database and role because the
# BoothModule declares `database: {enabled: true}` (ADR 0053), and writes the connection string
# into this Secret in our namespace. Override name/key only for an operator-managed database.
database:
  credentialsSecret:
    name: booth-database-credentials
    key: dsn

core:
  # booth-core's in-cluster gateway, through which booth-catalog is reached to resolve cataloged
  # code at save time. Leave empty to run with no catalog at all (inline code only).
  url: http://booth-core.booth-system.svc:8080

# ADR 0092: a workspace's booth-database (ADR 0081) — NOT this module's own database above, which
# task code can never reach. booth-database is optional, so this is empty by default and task pods
# stay closed. Set it to your bundled booth-database's in-cluster address (e.g.
# booth-database-postgres.booth-database.svc:5432) to let tasks reach it: that adds one egress rule
# to its Postgres pod on port 5432 (selector: runner.networkPolicy.egress.boothDatabase). Bundled
# mode only — an external booth-database has no in-cluster pod to select; use egress.extra for it.
#
# ADR 0095: with core.url also set, a task that has platform access additionally gets booth-core's
# credential sidecar in its pod (credentialSidecar below), proxying on 127.0.0.1:5432 with a
# short-lived lease issued as that task, and DATABASE_URL=postgresql://localhost:5432/<db> in its
# environment — no host, no credential in it. A task without platform access gets neither.
boothDatabase:
  url: ""

# ADR 0095 amendment: a workspace's booth-storage S3 backend (e.g. a self-hosted MinIO), for native
# s3 access. Empty by default: task pods stay closed. Set it to the backend's in-cluster address
# (e.g. minio.storage.svc:9000) to add ONE egress rule to that backend's pods on
# runner.networkPolicy.egress.boothStorage.port. There is no standard backend to default to, so its
# pod selector is required when this is set.
#
# ADR 0095 (third amendment): with core.url also set, a task with platform access whose workspace has
# a lakehouse warehouse also gets the s3-mode credential sidecar. It writes short-lived keys, and the
# endpoint/region, to files the task's S3 client finds through AWS_SHARED_CREDENTIALS_FILE /
# AWS_CONFIG_FILE. The warehouse is looked up per task from booth-lakehouse (GET /api/warehouse, as
# the task), so booth-lakehouse must be installed; a workspace without a warehouse gets no s3 sidecar.
# Engines that don't read AWS_CONFIG_FILE's endpoint themselves (DuckDB, pyarrow) need it passed
# explicitly (contracts/credential-sidecar.md, docs/decisions/0019).
boothStorage:
  url: ""

# ADR 0095 / contracts/credential-sidecar.md: booth-core's credential sidecar image, PINNED BY DIGEST
# (the chart refuses a tag). booth-core@8f0c6b4, publish run 37464892322: writes the s3 keys AND
# <credentials-file>.config (endpoint_url, region, and addressing_style nested under "s3 =", from the
# credential's pathStyle), and renews postgres leases at half their lifetime (ADR 0095 third to sixth
# amendments).
credentialSidecar:
  image: ghcr.io/projectbooth/credential-sidecar@sha256:6a0a795efd27f165e0714beb163d91f5c2feff55cfdc6f287aee979ae02cce14
  # A task with platform access waits up to this long for the sidecar's first lease before it starts
  # anyway (a task that never uses DATABASE_URL must not be blocked by a database outage).
  waitSeconds: 60
  # 0 = the sidecar's own defaults (contracts/credential-sidecar.md's RENEW_* knobs). Leave the margin
  # at 0: postgres then renews at half the lease's lifetime, which is what guarantees a task's open
  # connection about 30 minutes (ADR 0095 fifth amendment); any fixed margin replaces and shortens it.
  renewMarginSeconds: 0
  renewIntervalSeconds: 0
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

# Where workspace members' code runs (ADR 0057, ADR 0096): one Kubernetes Job — its own pod — per
# task attempt, holding NO module credentials and no service-account token. This is the only mode.
runner:
  # At most this many task Jobs outstanding at once (per API/scheduler replica); further tasks wait.
  maxConcurrent: 16
  # A task fails if its pod is not Ready this long after its Job is created (image pull, scheduling).
  startTimeoutSeconds: 300
  # Collects a finished task Job the API/scheduler pod never deleted (it normally deletes each one).
  ttlSecondsAfterFinished: 300
  # Each task pod's resources.
  resources: {}
  networkPolicy:
    enabled: true
    egress:
      dns:
        namespaceSelector: {kubernetes.io/metadata.name: kube-system}
        podSelector: {k8s-app: kube-dns}
      # booth-core's gateway, for ctx.storage / ctx.catalog. Match your install's namespace/labels.
      core:
        namespaceSelector: {kubernetes.io/metadata.name: booth-system}
        podSelector: {app.kubernetes.io/name: booth-core}
      # A bundled booth-database's Postgres pod (ADR 0092). Only rendered when boothDatabase.url is set.
      # Match your install's namespace; the pod labels are booth-database's own.
      boothDatabase:
        namespaceSelector: {kubernetes.io/metadata.name: booth-database}
        podSelector: {app.kubernetes.io/name: booth-database, app.kubernetes.io/component: postgres}
      # A workspace's booth-storage S3 backend. Only rendered when boothStorage.url is set, and then
      # podSelector is required: match your backend's own pods.
      boothStorage:
        namespaceSelector: {}
        podSelector: {}
        port: 9000
      # Raw NetworkPolicy egress rules. Empty by default: tasks reach storage and the catalog through
      # booth-core's gateway (the rule above, ADR 0059). Only needed if you point the runner at modules
      # directly with BOOTH_PIPELINE_STORAGE_URL / _CATALOG_URL.
      extra: []
      # Tasks may reach the public internet (never private ranges). Off unless you need it.
      allowInternet: false

# ADR 0056/0058: let tasks that opt in call booth-storage / booth-catalog as their run. Core mints
# short-lived tokens for the run; requires booth-core with workload identity enabled.
workloadIdentity:
  enabled: true

execution:
  # Runs execute in worker threads inside this pod; this bounds how many run at once. Further
  # runs wait in `queued`. Scale out with replicas rather than raising this without bound: every
  # running task is a subprocess in this pod's memory budget.
  maxWorkers: 4
  schedulerIntervalSeconds: 15
  maxLogLinesPerRun: 50000
  # Environment variable NAMES a task's subprocess may inherit from this pod (e.g. HTTPS_PROXY).
  # By default it inherits none: a task never sees the database DSN or any other module setting.
  runnerEnvPassthrough: []
  scratchSize: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
