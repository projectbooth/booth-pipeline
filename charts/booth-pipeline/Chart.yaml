apiVersion: v2
name: booth-pipeline
description: >
  Project Booth's pipeline module: a graphical DAG builder (Pipeline -> Task -> Job) backed by
  Dagster, with a base runner that needs no other module installed.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-pipeline

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells booth-core's
# install API which of this chart's values.yaml paths carry the platform's shared identity
# settings, so a module installed through the install API (the Module Store's Install button
# included) is configured without hand-typed values. Core fills a mapped path only when the request
# doesn't already set it. No workloadIssuerUrl: this module mints workload tokens
# (workloadIdentity.enabled) but never verifies them. No iframe-identity setting, so no
# iframeIssuerUrl.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","groupsClaim":"oidc.groupsClaim","coreUrl":"core.url"}
