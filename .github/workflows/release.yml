name: Release

# Tagging vX.Y.Z publishes the container image and the Helm chart (as an OCI artifact, the form
# booth-core's install API resolves — ADR 0028), so booth-module-store can point at a real chart.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-pipeline:${{ env.VERSION }}
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          helm package charts/booth-pipeline --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "booth-pipeline-${VERSION}.tgz" oci://ghcr.io/projectbooth/charts
