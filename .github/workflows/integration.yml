name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration. Runs on merge to main
# and nightly, not on every push/PR. See tests/integration/README.md for what it covers and what it
# does not.
#
# Every step below was run end to end on a local kind cluster on 2026-09-27 (it had never passed in
# CI before: its in-cluster curls lost their output to a `kubectl run -i` race, one checked a route
# ADR 0071 removed, and one expected a pod its NetworkPolicy blocks to reach the runner). It
# deploys against a stand-in for booth-core's BoothModule CRD and Postgres Secret rather than a
# real, pinned booth-core, so it proves the chart deploys and the module serves, not that core
# reconciles it — that is booth-e2e's job.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kind-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-pipeline-ci
      - uses: azure/setup-helm@v4

      - name: Build and load the image
        run: |
          docker build -t booth-pipeline:ci .
          kind load docker-image booth-pipeline:ci --name booth-pipeline-ci

      - name: Install the BoothModule CRD (vendored stand-in for booth-core's)
        run: kubectl apply -f tests/integration/fixtures/boothmodule-crd.yaml

      - name: PostgreSQL and the credentials Secret booth-core would provision (ADR 0053)
        run: |
          kubectl create namespace booth-pipeline
          kubectl apply -n booth-pipeline -f tests/integration/fixtures/postgres.yaml
          kubectl -n booth-pipeline rollout status deployment/postgres --timeout=180s
          kubectl -n booth-pipeline create secret generic booth-database-credentials \
            --from-literal=dsn=postgresql://booth:booth-test@postgres:5432/booth_pipeline

      - name: The Secret booth-core would provision for workload identity (ADR 0056), as a stand-in
        # The API pod mounts booth-workload-minting-credentials and waits for it. No core here, so
        # a dummy: enough to prove the wiring and that task pods do NOT get it (checked below).
        run: |
          kubectl -n booth-pipeline create secret generic booth-workload-minting-credentials \
            --from-literal=credential=bwmc.pipeline.ci-standin \
            --from-literal=url=http://booth-core.booth-system.svc:8080/api/internal/workload-tokens \
            --from-literal=issuer=http://booth-core.booth-system.svc:8080

      - name: Install the chart
        run: |
          helm install booth-pipeline charts/booth-pipeline \
            --namespace booth-pipeline \
            --set image.repository=booth-pipeline --set image.tag=ci --set image.pullPolicy=Never \
            --set oidc.issuerUrl=https://accounts.google.com --set oidc.clientId=booth-pipeline-ci \
            --set oidc.requireAudience=false --set core.url= \
            --wait --timeout 5m

      - name: The BoothModule registered, with the fields core reads (ADR 0019/0053)
        run: |
          m() { kubectl -n booth-pipeline get boothmodules.booth.projectbooth.io pipeline -o jsonpath="$1"; }
          test "$(m '{.spec.navPath}')" = "/pipeline"
          test "$(m '{.spec.navGroup}')" = "build"
          # checked on the LIVE resource: a CRD that does not know a field prunes it silently
          test "$(m '{.spec.database.enabled}')" = "true"
          test "$(m '{.spec.workloadIdentity.mint}')" = "true"

      - name: /healthz is 200 (migrations ran, the database is reachable)
        run: |
          # hack/incluster-curl.sh, not `kubectl run -i --rm`: see that script for why.
          out="$(bash hack/incluster-curl.sh booth-pipeline -sf --max-time 10 http://booth-pipeline.booth-pipeline.svc.cluster.local:8080/healthz)"
          echo "$out"; echo "$out" | grep -q '"status":"ok"'

      - name: The API refuses unauthenticated requests in-cluster
        run: |
          # /api/tasks, not the retired /api/jobs (ADR 0071 removed Job): a route that no longer
          # exists answers 404, which says nothing about whether authentication is enforced.
          for path in /api/pipelines /api/tasks /api/runs /api/runners; do
            bash hack/incluster-curl.sh booth-pipeline -s --max-time 10 -o /dev/null -w 'status=%{http_code}' \
              "http://booth-pipeline.booth-pipeline.svc.cluster.local:8080$path" \
              | grep -q 'status=401' || { echo "$path was not refused"; exit 1; }
          done

      - name: Kubernetes API access is exactly "run task Jobs", and only for the API pod (ADR 0096)
        run: |
          api="system:serviceaccount:booth-pipeline:booth-pipeline"
          task="system:serviceaccount:booth-pipeline:booth-pipeline-task"
          can() { test "$(kubectl auth can-i $2 -n booth-pipeline --as="$1")" = "$3" || { echo "$1 '$2': expected $3"; exit 1; }; }
          for v in "create jobs.batch" "delete jobs.batch" "list pods" "create secrets" "delete secrets"; do can "$api" "$v" yes; done
          # Never read a Secret back, never a task's logs or a shell in its pod, nothing outside its namespace.
          # (A subresource needs --subresource: "get pods/log" would ask about a pod NAMED log.)
          for v in "get secrets" "list secrets" "get pods --subresource=log" "create pods --subresource=exec" "create pods --subresource=attach" "create pods"; do can "$api" "$v" no; done
          test "$(kubectl auth can-i create jobs.batch -n kube-system --as="$api")" = "no"
          for v in "create jobs.batch" "get secrets" "list pods" "get pods --subresource=log"; do can "$task" "$v" no; done
          test "$(kubectl -n booth-pipeline get pod -l app.kubernetes.io/component=api -o jsonpath='{.items[0].spec.automountServiceAccountToken}')" = "true"

      - name: Two concurrent tasks from different workspaces cannot reach each other's token, Secret, pod or logs (ADR 0096)
        # Real Jobs, created by the API pod with its own token and Role, on a CNI that enforces the
        # task NetworkPolicy. Each task tries the original attack (/tmp, /proc), the Kubernetes API,
        # and a direct connection to the other's pod: tests/integration/task_jobs_driver.py.
        run: |
          kubectl -n booth-pipeline exec -i deploy/booth-pipeline -- python - isolation < tests/integration/task_jobs_driver.py

      - name: A pod that is not the API cannot call a task pod
        run: |
          # A task that runs long enough to aim at its pod while it is up.
          kubectl -n booth-pipeline exec -i deploy/booth-pipeline -- python - sleep 40 < tests/integration/task_jobs_driver.py &
          ip=""
          for _ in $(seq 1 90); do
            ip="$(kubectl -n booth-pipeline get pod -l app.kubernetes.io/component=task -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || true)"
            [ -n "$ip" ] && break; sleep 1
          done
          test -n "$ip" || { echo "no task pod appeared"; exit 1; }
          bash hack/incluster-curl.sh booth-pipeline -s --max-time 5 -o /dev/null -w 'status=%{http_code}' -X POST "http://$ip:8080/v1/run" \
            | grep -q 'status=000' || { echo "a pod that is not the API reached a task pod"; exit 1; }
          wait

      - name: Finished tasks leave no Job, pod or Secret behind
        run: |
          left=""
          for _ in $(seq 1 60); do
            left="$(kubectl -n booth-pipeline get jobs,pods,secrets -l booth.projectbooth.io/task-job -o name)"
            [ -z "$left" ] && exit 0; sleep 1
          done
          echo "left behind: $left"; exit 1

      - name: Task pod cold start, measured
        run: |
          out="$(kubectl -n booth-pipeline exec -i deploy/booth-pipeline -- python - coldstart 5 < tests/integration/task_jobs_driver.py)"
          echo "$out"
          { echo '### Task pod cold start (Job created -> pod Ready), 5 sequential tasks'; echo '```json'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: A refreshed platform token reaches a running task pod, measured
        run: |
          out="$(kubectl -n booth-pipeline exec -i deploy/booth-pipeline -- python - refresh < tests/integration/task_jobs_driver.py)"
          echo "$out"
          { echo '### Token refresh latency (minted in the API pod -> seen by the task)'; echo '```json'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Task pods reach a bundled booth-database only once boothDatabase.url is set, and never their own module's database (ADR 0092)
        run: |
          kubectl create namespace booth-database
          kubectl apply -n booth-database -f tests/integration/fixtures/booth-database-postgres.yaml
          kubectl -n booth-database rollout status deployment/booth-database-postgres --timeout=180s
          # A TCP connect from INSIDE a real task pod (where task code runs), so this tests the
          # policy as enforced by the CNI, not just what the chart renders.
          bdb=booth-database-postgres.booth-database.svc.cluster.local:5432
          own=postgres.booth-pipeline.svc.cluster.local:5432
          probe() { kubectl -n booth-pipeline exec -i deploy/booth-pipeline -- python - probe "$bdb" "$own" < tests/integration/task_jobs_driver.py; }
          # Control, so a "blocked" below means the policy, not a wrong address or a broken probe:
          # the API pod legitimately uses this module's database.
          kubectl -n booth-pipeline exec deploy/booth-pipeline -- \
            python -c 'import socket; socket.create_connection(("postgres.booth-pipeline.svc.cluster.local", 5432), timeout=5)' \
            || { echo "control failed: the API pod cannot reach its own database"; exit 1; }
          before="$(probe)"; echo "before: $before"
          test "$before" = "{\"$bdb\": false, \"$own\": false}" || { echo "a task reached a database before opting in"; exit 1; }
          helm upgrade booth-pipeline charts/booth-pipeline --namespace booth-pipeline --reuse-values \
            --set boothDatabase.url="$bdb" --wait --timeout 5m
          after="$(probe)"; echo "after: $after"
          test "$after" = "{\"$bdb\": true, \"$own\": false}" || { echo "expected booth-database reachable and this module's own database not"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n booth-pipeline get all,jobs,secrets,networkpolicies
          kubectl -n booth-pipeline logs deployment/booth-pipeline --tail=200 || true
          kubectl -n booth-pipeline describe pods -l app.kubernetes.io/component=task || true
