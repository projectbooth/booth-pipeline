# kind with its default CNI off, for Calico (cni/calico.sh). kindnet does not reliably enforce egress
# NetworkPolicy (booth-spark measured it on kind v0.33.0: a default-deny egress policy left the API
# server, the internet and another namespace's pod reachable; ARCHITECTURE.md item 60). Task pods'
# egress rules are this module's security boundary (ADR 0057/0096), so Integration runs Calico and
# tests/integration/egress.sh proves enforcement on every run. Copied from booth-streamlit (same pins).
# Pods in kind's usual 10.244.0.0/16, not Calico's default 192.168.0.0/16: that pool would make every
# 192.168.x address a cluster address, and egress.sh probes a 192.168.x LAN host that is not one
# (cni/lan-targets.env). Calico takes its pool from this (kubeadm's podSubnet).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
