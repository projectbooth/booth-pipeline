# A stand-in for booth-core's credential broker (contracts/credential-broker.md), for the ADR 0095
# credential-sidecar checks in .github/workflows/integration.yml. Test fixture only.
#
# It speaks the broker's wire format to the REAL, digest-pinned credential-sidecar, and behaves like
# booth-database's postgres provider where it matters to the test: every lease is a brand-new Postgres
# LOGIN role with its own password and a short expiry (so the sidecar really rotates onto a different
# credential), granted on the workspace's own database. It does not verify the bearer (no core here
# to have minted one); it does insist on X-Workspace matching the requested scope and on the
# read/readwrite rule. GET /leases lists what it issued, for the test to assert on.
#
# For s3 (ADR 0095, third amendment) it also stands in for booth-lakehouse behind core's gateway:
# GET /modules/lakehouse/api/warehouse returns a warehouse for workspace "acme" and 404 for any other,
# and an s3 lease is issued only for exactly that warehouse's {backendId, path}. Each s3 lease has fresh
# keys (real ones: a pool of MinIO users, see s3-backend.yaml). Its credential is booth-storage's real shape (keys plus endpoint/region/bucket/keyPrefix/
# pathStyle, internal/credentialbroker/provider.go). The sidecar decodes it strictly, so a shape the
# pinned sidecar doesn't know fails the test, not silently. S3_CREDENTIAL_SHAPE=keys sends only the
# keys (what booth-core@eb24bb3 accepted), kept for comparing against an older sidecar.
#
# For the Spark runner (ADR 0119, tests/integration/spark.sh) it also stands in for core's workload-token
# mint (POST /api/internal/workload-tokens: a token per request, refused on demand through
# POST /_control/mint {"owner": ..., "code": ...|null}, with the code core gives for a service account;
# GET /mints lists every request; GET /api/service-accounts/{name} answers for svc:acme:nfl-weekly) and,
# when the fake-spark ConfigMap is mounted, for booth-spark behind
# the gateway (/modules/spark/*, fixtures/spark/spark_standin.py, mounted at /spark).
#
# For the check against the REAL booth-spark (spark-real.sh) it signs what it mints: workload tokens are
# RS256 JWTs from issuer WORKLOAD_ISSUER (keys at /.well-known/jwks.json, as booth-spark reads core's),
# with sub, groups (/workspaces/<ws>/<role>), booth_module=pipeline and booth_owner. A test identity
# provider at WORKLOAD_ISSUER/test-idp (discovery, keys, and POST /test-idp/token {sub, workspace, role})
# issues person tokens. POST /_control/spark {"upstream": URL|null} sends /modules/spark/* to a real
# booth-spark the way core's gateway does (prefix stripped, X-Workspace forwarded as X-Booth-Workspace),
# or back to the stand-in.
#
# Pod labels match booth-core's (app.kubernetes.io/name: booth-core) in booth-system, so the task
# NetworkPolicy's existing core rule is what lets a task pod's sidecar reach it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-core-broker
data:
  broker.py: |
    import hashlib, json, os, secrets, threading, time, uuid
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import psycopg
    from psycopg import sql

    ADMIN = os.environ["ADMIN_DSN"]  # superuser on the booth-database stand-in
    PG_HOST, PG_PORT = os.environ["PG_HOST"], int(os.environ.get("PG_PORT", "5432"))
    LEASE_SECONDS = int(os.environ.get("LEASE_SECONDS", "30"))
    S3_SHAPE = os.environ.get("S3_CREDENTIAL_SHAPE", "full")
    S3_USERS = 40  # the MinIO user pool s3-backend.yaml creates
    s3_next = 0
    WAREHOUSES = {"acme": {"workspace": "acme", "backendId": "minio-ci", "path": "lakehouse/acme",
                           "warehouseName": "acme", "storageRoot": "s3://booth-ci/lakehouse/acme"}}
    leases, lock = [], threading.Lock()

    def issue_s3(ws, access, scope):
        wh = WAREHOUSES.get(ws)
        if wh is None or scope != {"backendId": wh["backendId"], "path": wh["path"]}:
            return None
        expires = datetime.now(timezone.utc) + timedelta(seconds=LEASE_SECONDS)
        # Real keys: the next of the MinIO users s3-backend.yaml created (AKCILEASE01..40), so each
        # lease's keys differ and actually work. No session token: those are plain MinIO users.
        global s3_next
        with lock:
            s3_next += 1
            n = (s3_next - 1) % S3_USERS + 1
        cred = {"accessKeyId": f"AKCILEASE{n:02d}", "secretAccessKey": f"booth-ci-lease-secret-{n:02d}"}
        if S3_SHAPE == "full":
            cred.update({"endpoint": "http://s3-backend.booth-storage-ci.svc.cluster.local:9000", "region": "us-east-1",
                         "bucket": "booth-ci", "keyPrefix": wh["path"], "pathStyle": True})
        lease = {"leaseId": str(uuid.uuid4()), "kind": "s3", "workspace": ws, "access": access, "scope": scope,
                 "accessKeyId": cred["accessKeyId"], "at": time.time()}
        with lock:
            leases.append(lease)
        return {"leaseId": lease["leaseId"], "kind": "s3", "expiresAt": expires.isoformat().replace("+00:00", "Z"),
                "scope": scope, "credential": cred}

    def dbname(ws):  # booth-database internal/naming.ForWorkspace
        return "bdb_ws_" + hashlib.sha256(f"booth-database/workspace/{ws}".encode()).hexdigest()[:24]

    def issue(ws, access):
        db = dbname(ws)
        user = "bdb_lease_" + secrets.token_hex(6)
        password = secrets.token_urlsafe(18)
        expires = datetime.now(timezone.utc) + timedelta(seconds=LEASE_SECONDS)
        with psycopg.connect(ADMIN, autocommit=True) as c:
            if not c.execute("SELECT 1 FROM pg_database WHERE datname=%s", (db,)).fetchone():
                c.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
            c.execute(sql.SQL("CREATE ROLE {} LOGIN PASSWORD {}").format(sql.Identifier(user), sql.Literal(password)))
            c.execute(sql.SQL("GRANT CONNECT ON DATABASE {} TO {}").format(sql.Identifier(db), sql.Identifier(user)))
        with psycopg.connect(ADMIN.rsplit("/", 1)[0] + "/" + db, autocommit=True) as c:
            c.execute(sql.SQL("GRANT USAGE, CREATE ON SCHEMA public TO {}").format(sql.Identifier(user)) if access == "readwrite"
                      else sql.SQL("GRANT USAGE ON SCHEMA public TO {}").format(sql.Identifier(user)))
            c.execute(sql.SQL("GRANT {} ON ALL TABLES IN SCHEMA public TO {}").format(
                sql.SQL("ALL") if access == "readwrite" else sql.SQL("SELECT"), sql.Identifier(user)))
        lease = {"leaseId": str(uuid.uuid4()), "kind": "postgres", "workspace": ws, "access": access, "user": user, "at": time.time()}
        with lock:
            leases.append(lease)
        return {"leaseId": lease["leaseId"], "kind": "postgres", "expiresAt": expires.isoformat().replace("+00:00", "Z"),
                "scope": {"workspace": ws},
                "credential": {"host": PG_HOST, "port": PG_PORT, "database": db, "username": user, "password": password, "sslMode": "disable"}}

    # ---- signing: core's workload issuer, and a test identity provider for person tokens ----
    import jwt as pyjwt
    from cryptography.hazmat.primitives.asymmetric import rsa
    from jwt.algorithms import RSAAlgorithm

    WORKLOAD_ISSUER = os.environ.get("WORKLOAD_ISSUER", "http://booth-core.booth-system.svc.cluster.local:8080")
    IDP = WORKLOAD_ISSUER + "/test-idp"
    KEY = rsa.generate_private_key(public_exponent=65537, key_size=2048)
    JWK = {**json.loads(RSAAlgorithm.to_jwk(KEY.public_key())), "kid": "ci-1", "use": "sig", "alg": "RS256"}

    def sign(claims):
        now = int(time.time())
        return pyjwt.encode({"iat": now, "nbf": now - 5, "exp": now + 600, **claims}, KEY, algorithm="RS256", headers={"kid": "ci-1"})

    spark_upstream = [None]  # a real booth-spark's base URL, or None for the stand-in

    # ---- core's workload-token mint (ADR 0056/0058), for the Spark runner's scheduled runs ----
    mints, refusals = [], {}  # owner -> None (one indistinguishable 403) or a service-account code
    SERVICE_ACCOUNTS = {"nfl-weekly": {"role": "editor", "disabled": False}}  # in workspace acme

    def mint(req):
        with lock:
            mints.append(req)
            owner = req.get("owner", "")
            if owner in refusals:
                code = refusals[owner]
                return 403, {"error": "forbidden", **({"code": code} if code else {})}
        exp = (datetime.now(timezone.utc) + timedelta(minutes=10)).isoformat()
        role = req.get("roleCeiling", "viewer")
        token = sign({"iss": WORKLOAD_ISSUER, "sub": req["subject"], "groups": [f"/workspaces/{req['workspace']}/{role}"],
                      "booth_module": "pipeline", "booth_owner": req.get("owner", "")})
        return 200, {"token": token, "tokenType": "Bearer", "expiresAt": exp, "role": role}

    # ---- booth-spark behind the gateway, when fixtures/spark is mounted at /spark ----
    # (an absent optional ConfigMap still mounts, as an empty directory: look for the file)
    standin = None
    if os.path.isfile("/spark/spark_standin.py"):
        import sys
        sys.path.insert(0, "/spark")
        import spark_standin
        standin = spark_standin.StandIn()

    class H(BaseHTTPRequestHandler):
        def raw(self, code, headers, raw):
            self.send_response(code)
            for k, v in headers.items():
                self.send_header(k, v)
            self.send_header("Content-Length", str(len(raw))); self.end_headers(); self.wfile.write(raw)

        def spark(self):
            body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            if spark_upstream[0]:
                return self.proxy(spark_upstream[0], self.path[len("/modules/spark"):], body)
            if standin is None:
                return self.reply(404, {"error": "booth-spark is not installed here"})
            return self.raw(*standin.route(self.command, self.path, dict(self.headers), body))

        def proxy(self, base, path, body):
            """Core's gateway to a module: the prefix stripped, X-Workspace forwarded as X-Booth-Workspace."""
            import urllib.error, urllib.request
            h = {k: v for k, v in self.headers.items() if k.lower() in ("authorization", "content-type", "idempotency-key")}
            h["X-Booth-Workspace"] = self.headers.get("X-Workspace", "")
            req = urllib.request.Request(base + path, data=body if self.command == "POST" else None, headers=h, method=self.command)
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    status, rh, raw = r.status, dict(r.headers), r.read()
            except urllib.error.HTTPError as e:
                status, rh, raw = e.code, dict(e.headers or {}), e.read()
            keep = {k: v for k, v in rh.items() if k.lower() in ("content-type", "x-log-offset", "x-log-complete", "x-log-skipped")}
            return self.raw(status, keep, raw)

        def reply(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw))); self.end_headers(); self.wfile.write(raw)

        def do_GET(self):
            if self.path.startswith("/modules/spark/"):
                return self.spark()
            if self.path == "/.well-known/jwks.json" or self.path == "/test-idp/jwks":
                return self.reply(200, {"keys": [JWK]})
            if self.path == "/test-idp/.well-known/openid-configuration":
                return self.reply(200, {"issuer": IDP, "jwks_uri": IDP + "/jwks", "authorization_endpoint": IDP + "/auth",
                                        "token_endpoint": IDP + "/token", "response_types_supported": ["id_token"],
                                        "subject_types_supported": ["public"], "id_token_signing_alg_values_supported": ["RS256"]})
            if self.path.startswith("/api/service-accounts/"):  # core's per-account state (ADR 0120), any member
                name = self.path.rsplit("/", 1)[1]
                acct = SERVICE_ACCOUNTS.get(name)
                return self.reply(200, {"name": name, "role": acct["role"], "disabled": acct["disabled"]}) if acct else self.reply(404, {"error": "service account not found"})
            if self.path == "/mints":
                with lock:
                    return self.reply(200, mints)
            if self.path == "/leases":
                with lock:
                    return self.reply(200, leases)
            if self.path == "/modules/lakehouse/api/warehouse":  # booth-lakehouse, through the gateway
                if not self.headers.get("Authorization", "").startswith("Bearer "):
                    return self.reply(401, {"detail": "a bearer token is required"})
                ws = self.headers.get("X-Workspace", "")
                wh = WAREHOUSES.get(ws)
                return self.reply(200, wh) if wh else self.reply(404, {"detail": f"workspace {ws!r} has no warehouse yet"})
            return self.reply(200 if self.path == "/healthz" else 404, {"status": "ok"})

        def do_POST(self):
            if self.path.startswith("/modules/spark/"):
                return self.spark()
            if self.path == "/api/internal/workload-tokens":
                if not self.headers.get("Authorization", "").startswith("Bearer "):
                    return self.reply(401, {"error": "missing minting credential"})
                return self.reply(*mint(json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))))
            if self.path == "/test-idp/token":  # a person's token, for the real booth-spark check
                req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
                return self.reply(200, {"token": sign({"iss": IDP, "sub": req["sub"], "preferred_username": req["sub"],
                                                       "groups": [f"/workspaces/{req['workspace']}/{req['role']}"]})})
            if self.path == "/_control/spark":
                req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
                spark_upstream[0] = req.get("upstream")
                return self.reply(200, {"upstream": spark_upstream[0]})
            if self.path == "/_control/mint":
                req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
                with lock:
                    if req.get("clear"):
                        refusals.clear()
                    else:
                        refusals[req["owner"]] = req.get("code")
                    return self.reply(200, dict(refusals))
            if self.path != "/api/credentials":
                return self.reply(404, {"error": "not found"})
            if not self.headers.get("Authorization", "").startswith("Bearer "):
                return self.reply(401, {"error": "missing bearer token"})
            req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
            ws = self.headers.get("X-Workspace", "")
            if req.get("access") not in ("read", "readwrite"):
                return self.reply(400, {"error": "bad access"})
            if req.get("kind") == "s3":
                out = issue_s3(ws, req["access"], req.get("scope") or {})
                return self.reply(201, out) if out else self.reply(422, {"error": "scope_not_supported"})
            if req.get("kind") != "postgres" or (req.get("scope") or {}).get("workspace") != ws:
                return self.reply(422, {"error": "scope_not_supported"})
            try:
                return self.reply(201, issue(ws, req["access"]))
            except Exception as e:  # a provider outage, as the sidecar would see one
                return self.reply(503, {"error": f"provider unavailable: {e.__class__.__name__}"})

        def log_message(self, *a):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booth-core
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: booth-core}
  template:
    metadata:
      labels: {app.kubernetes.io/name: booth-core}
    spec:
      containers:
        - name: broker
          image: booth-pipeline:ci
          imagePullPolicy: Never
          command: ["python", "/app/broker.py"]
          env:
            - {name: ADMIN_DSN, value: "postgresql://booth:booth-test@booth-database-postgres.booth-database.svc.cluster.local:5432/postgres"}
            - {name: PG_HOST, value: booth-database-postgres.booth-database.svc.cluster.local}
            - {name: LEASE_SECONDS, value: "30"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: spark, mountPath: /spark}
      volumes:
        - name: app
          configMap: {name: fake-core-broker}
        # The stand-in booth-spark (fixtures/spark/), created by spark.sh; absent before that.
        - name: spark
          configMap:
            name: fake-spark
            optional: true
            items:
              - {key: spark_standin.py, path: spark_standin.py}
              - {key: pyspark_init.py, path: pyspark/__init__.py}
              - {key: pyspark_sql_init.py, path: pyspark/sql/__init__.py}
---
apiVersion: v1
kind: Service
metadata:
  name: booth-core
spec:
  selector: {app.kubernetes.io/name: booth-core}
  ports:
    - port: 8080
