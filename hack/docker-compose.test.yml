# The one external service the store tests talk to. CI runs this same image (see
# .github/workflows/ci.yml), so a green local run means what a green CI run means. Test tooling
# only — not used at runtime.
#
#   docker compose -f hack/docker-compose.test.yml up -d --wait
#   eval "$(sh hack/test-env.sh)"        # BOOTH_TEST_POSTGRES_DSN
#   pytest
#   docker compose -f hack/docker-compose.test.yml down -v
#
# Port 15434: catalog uses 15433 and storage 15432, so all three can run side by side. The
# explicit project name matters for the same reason it does in booth-catalog: every repo keeps
# its compose file in a directory called "hack", and Compose would otherwise merge them into one
# project, where one repo's `down` removes another's containers.
name: booth-pipeline-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: booth-test
      POSTGRES_DB: booth_pipeline_test
    ports: ["15434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth_pipeline_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ADR 0123: event triggers' JetStream consumer, against a real server (tests/unit/test_event_bus_nats.py).
  # Unauthenticated here; the deployed bus is core's, with per-module credentials (ADR 0050).
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-p", "4222", "-m", "8222"]
    ports: ["14222:4222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz?js-enabled-only=true || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A bus that requires authentication, so a test can hand the consumer a credential it rejects (the
  # failure modes in tests/unit/test_event_bus_failures.py). Its user and password are test-only.
  nats-auth:
    image: nats:2.11-alpine
    command: ["-p", "4222", "-m", "8222", "--user", "ci", "--pass", "ci-only-password"]
    ports: ["14223:4222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

